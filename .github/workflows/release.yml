name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Prepare release artifacts
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          echo "MOD_JAR=build/libs/pushdozer-${VERSION}.jar" >> $GITHUB_ENV
          echo "SOURCES_JAR=build/libs/pushdozer-${VERSION}-sources.jar" >> $GITHUB_ENV

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.MOD_JAR }}
            ${{ env.SOURCES_JAR }}
          body: |
            ## Installation

            Download **pushdozer-*.jar** (without `-sources`) and place it in your `.minecraft/mods` folder.

            The `-sources.jar` attachment is for developers only.
          generate_release_notes: true
